<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budsjettkalkulator</title> <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
    <h1>Budsjettkalkulator</h1>
    </header>

    <div class="boks">

    <div class="inntekt">
    <h2>Inntekt</h2>

    <p>Navn på inntekt</p>
    <input type="text" id="inntektNavn" placeholder="Inntekt">

    <p>Beløp</p>
    <input type="number" id="inntektBelop" placeholder="0">

    <button id="leggTilInntekt">Legg til inntekt</button>

    <div id="inntekter"></div>
    </div>

    <div class="utgift">
    <h2>Utgift</h2>

    <p>Navn på utgift</p>
    <input type="text" id="utgiftNavn" placeholder="Utgift">

    <p>Beløp</p>
    <input type="number" id="utgiftBelop" placeholder="0">

    <button id="leggTilUtgift">Legg til utgift</button>

    <div id="utgifter"></div>
    </div>

    </div>

    <div class="resultat">
    <h2>Resultat</h2>

    <p>Totale inntekter: <span id="totalInntekt">0</span> kr</p>
    <p>Totale utgifter: <span id="totalUtgift">0</span> kr</p>
    <p>Saldo: <span id="saldo">0</span> kr</p>
    </div>

        <script src="script.js"></script>

</body>
</html>
